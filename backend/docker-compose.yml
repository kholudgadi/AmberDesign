services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: amberdesign
      POSTGRES_USER: amberdesign
      POSTGRES_PASSWORD: amberdesign
    ports:
      - "5432:5432"
    volumes:
      - amberdesign_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U amberdesign"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  amberdesign_postgres:
